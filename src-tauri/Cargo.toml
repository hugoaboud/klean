[package]
name = "klean"
version = "0.1.0"
description = "KLEAN - a visual editor for Lean projects"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "klean_lib"
# No `cdylib`: the parser is a statically linked copy of Lean, whose runtime uses
# initial-exec TLS, which a shared library cannot take. Mobile targets build the
# staticlib instead; desktop links the binary.
crate-type = ["staticlib", "rlib"]

[features]
# This feature is used for production builds (embedded front-end assets).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lean project engine
vfs = "0.13"
# Lean's own parser, as a static library (see lean4-ast/)
klean-ast = { path = "../lean4-ast/crates/klean-ast" }
# AI sessions: providers, streaming and the MCP tools the model may call.
klean-ai = { path = "klean-ai" }
# Only used by the in-app Lean toolchain installer.
ureq = "2"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# zip leaves the deflate backend to the host crate
flate2 = "1"
toml = "0.8"
base64 = "0.22"
thiserror = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
